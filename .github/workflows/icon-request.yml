# Checks an icon request (the "Icon request" issue form) when it is opened, edited or reopened:
# AppID in WinGet, icon already there, attached image usable. Answers with one comment and one label.
name: Icon request check

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: startsWith(github.event.issue.title, '[Icon request]') || contains(github.event.issue.labels.*.name, 'icon-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the request
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/Check-IconRequest.ps1
